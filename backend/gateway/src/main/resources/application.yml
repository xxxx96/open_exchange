server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: classpath:secrets.properties
  cloud:
    gateway:
      routes:
        # User Service
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/account/**
        # Wallet Service
        - id: wallet-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/wallet/**
        # Spot Trading
        - id: spot-trading
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/spot/**
        # Contract Trading
        - id: contract-trading
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/contract/**
        # Market Data
        - id: market-data
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/market/**
        # Admin
        - id: admin-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/admin/**
      # CORS
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

logging:
  level:
    com.exchange: DEBUG
    org.springframework.cloud.gateway: INFO
jwt:
  access-token-secret: ${JWT_ACCESS_SECRET:changeme-access-secret-key-min-256-bits}