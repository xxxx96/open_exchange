spring:
  data:
    redis:
      # infrastructure/docker-compose.yml 的 exchange-redis 容器（refresh token 吊销黑名单）
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

jwt:
  access-token-private-key: ${ACCESS-TOKEN-PRIVATE-KEY}
  access-token-public-key: ${ACCESS-TOKEN-PUBLIC-KEY}
  refresh-token-private-key: ${REFRESH-TOKEN-PRIVATE-KEY}
  refresh-token-public-key: ${REFRESH-TOKEN-PUBLIC-KEY}
  access-token-expiration: 1800000      # 30 分钟
  refresh-token-expiration: 604800000   # 7 天
